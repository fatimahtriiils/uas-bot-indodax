  --up:#6fe0b0;--up-soft:#1f3b33;--down:#ff8a96;--down-soft:#4a2230;--warn:#f5c46a;--warn-soft:#3e3221;

*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who b{display:block;font-size:16px;letter-spacing:-.01em}
.who span{font-size:13px;color:var(--ink3)}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--up);box-shadow:0 0 0 4px var(--up-soft)}
.dot.bad{background:var(--down);box-shadow:0 0 0 4px var(--down-soft)}
button.theme{font:inherit;font-size:13px;color:var(--ink2);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
nav{max-width:1200px;margin:0 auto;padding:6px 14px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;text-decoration:none;font-size:13.5px;color:var(--ink2);padding:9px 10px 11px;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--line2)}
main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
section{margin:0 0 44px}
h1{font-size:clamp(26px,3.4vw,38px);line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:0 0 10px;max-width:22ch}
h2{font-size:21px;letter-spacing:-.015em;margin:0 0 4px;font-weight:650}
h3{font-size:15px;margin:22px 0 8px;font-weight:650}
.lede{color:var(--ink2);max-width:72ch;margin:0 0 18px}
.sub{color:var(--ink3);font-size:13.5px;margin:0 0 16px;max-width:80ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:18px 20px}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;margin:0 0 22px;color:var(--ink)}
.notice.bad{border-left-color:var(--down);background:var(--down-soft)}
.notice ul{margin:4px 0 0 18px;padding:0}
.src{font-size:12.5px;color:var(--ink3);margin:0 0 22px}
.src code{color:var(--ink2)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:end;margin-bottom:22px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--ink3)}.facts dd{margin:0;color:var(--ink2)}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);margin-bottom:8px;gap:10px}
.tl-head b{font-size:15px;color:var(--ink)}
.ticks{display:grid;gap:3px;grid-auto-flow:column;grid-template-rows:repeat(6,11px);justify-content:start}
.tk{width:11px;height:11px;border-radius:2px;background:var(--pending)}
.tk.ok{background:var(--up)}.tk.miss{background:var(--down)}.tk.wait{background:var(--line2)}
.daylab{display:grid;grid-auto-flow:column;gap:3px;justify-content:start;font-size:11px;color:var(--ink3);margin-top:6px}
.daylab span{width:11px;overflow:visible;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:3px;width:14px;border-radius:2px;vertical-align:3px}
.ledger{display:grid;grid-template-columns:repeat(5,1fr)}
.ledger>div{padding:18px 20px;border-left:1px solid var(--line)}
.ledger>div:first-child{border-left:0}
.ledger .l{font-size:13px;color:var(--ink2)}
.ledger .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.ledger .s{font-size:12.5px;color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.muted{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{width:100%;height:auto;display:block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12.5px;color:var(--ink3);font-weight:600;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
.empty{color:var(--ink3);font-size:13.5px;padding:18px 20px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.chip.ok{background:var(--up-soft);color:var(--up)}.chip.bad{background:var(--down-soft);color:var(--down)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.yes{color:var(--up);font-weight:700}.no{color:var(--ink3)}
code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-size:12.5px}
.note{font-size:12.5px;color:var(--ink3);margin:10px 2px 0;max-width:110ch}
.rub{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.rub .panel{padding:16px 18px}
.rub h3{margin:0 0 2px;display:flex;justify-content:space-between;gap:10px}
.rub h3 small{font-weight:500;color:var(--ink3);font-size:12.5px}
.ck{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.ck li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13.5px}
.ck .m{width:16px;height:16px;border-radius:50%;margin-top:2px;border:2px solid var(--line2)}
.ck .m.ok{border-color:var(--up);background:var(--up)}
.ck .m.wait{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.ck span.d{display:block;color:var(--ink3);font-size:12.5px}

.who b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:8px;vertical-align:2px;box-shadow:12px 0 0 var(--slate)}

.rub .panel{border-top:3px solid var(--mint)}
.chip.ok{background:var(--mint-soft)}

.kgrp.mint>h3 i{background:var(--slate)}
.kcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;min-height:118px}
.kc .l{font-size:13px;color:var(--ink2)}
.kc .v{font-size:30px;font-weight:750;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.1}
.kc .s{font-size:12.5px;color:var(--ink3)}
.kc .v.vrp{font-size:21px;margin-top:10px;word-break:break-all}
.kgrp h2,#metrik h2{margin-top:6px}
.kc.hl{border-color:var(--rose);background:linear-gradient(180deg,var(--rose-soft),var(--surface) 80%)}
.kc.hm{border-color:var(--slate);background:linear-gradient(180deg,var(--mint-soft),var(--surface) 80%)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--ink3)}
footer code{color:var(--ink2)}
.upd{font-size:12px;color:var(--ink3)}

@media (max-width:900px){
  .hero,.grid2{grid-template-columns:1fr}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ok=x=>x!==null&&x!==undefined&&!(typeof x==='number'&&!isFinite(x));
const nf=(x,d=0)=>ok(x)?x.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=(x,d=2,sign=true)=>ok(x)?((sign&&x>0?'+':'')+nf(x*100,d)+'%'):'—';
const pp=(x,d=2)=>ok(x)?((x>0?'+':'')+nf(x,d)+'%'):'—';

const cls=x=>ok(x)?(x>0?'up':x<0?'down':''):'';
const wib=t=>ok(t)?new Date((t+7*3600)*1000).toISOString().slice(0,16).replace('T',' ')+' WIB':'—';
const wibS=s=>s?wib(Date.parse(s)/1000):'—';
const chip=(t,k='')=>`<span class="chip ${k}">${esc(t)}</span>`;
const yn=v=>v===true?'<span class="yes" title="terpenuhi">✓</span>':v===false?'<span class="no" title="tidak terpenuhi">✗</span>':'<span class="no">—</span>';
const pair=p=>String(p).replace(/idr$/,'/IDR').toUpperCase();
const tbl=(head,rows,num=[],emptyText='Belum ada data.')=>rows.length?`<div class="panel tw"><table><thead><tr>${head.map((h,i)=>`<th${num.includes(i)?' class="n"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${num.includes(i)?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="panel empty">${emptyText}</div>`;

function chart(series,{h=250,fmt}={}){
  const all=series.flatMap(s=>s.pts).filter(p=>ok(p[1]));
  if(all.length<2) return '<div class="empty">Grafik muncul setelah ada minimal dua titik equity.</div>';
  const W=600,H=h,L=58,R=10,T=10,B=24;
  const x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]));
  let y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const base=series[0].base; if(ok(base)){y0=Math.min(y0,base);y1=Math.max(y1,base)}
  if(y0===y1){y0*=.995;y1*=1.005} const pad=(y1-y0)*.06;y0-=pad;y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0||1)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const grid=[0,.25,.5,.75,1].map(f=>{const v=y0+f*(y1-y0);return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--ink3)">${fmt(v)}</text>`}).join('');
  const baseL=ok(base)?`<line x1="${L}" x2="${W-R}" y1="${Y(base)}" y2="${Y(base)}" stroke="var(--ink3)" stroke-dasharray="3 4"/>`:'';
  const xl=[x0,(x0+x1)/2,x1].map((t,i)=>`<text x="${X(t)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}" font-size="12" fill="var(--ink3)">${new Date((t+7*3600)*1000).toISOString().slice(0,10)}</text>`).join('');
  const lines=series.map(s=>{const pts=s.pts.filter(p=>ok(p[1]));const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    const area=s.fill&&pts.length?`<path d="${d} L${X(pts[pts.length-1][0]).toFixed(1)} ${H-B} L${X(pts[0][0]).toFixed(1)} ${H-B} Z" fill="${s.color}" opacity=".08"/>`:'';
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik equity">${grid}${baseL}${xl}${lines}</svg><div class="legend">${series.map(s=>`<span><i class="line" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${ok(base)?'<span><i class="line" style="background:var(--ink3)"></i>Modal awal</span>':''}</div>`;
}

function timeline(R){
  const S=R.strategi||{},F=R.forward||{},O=R.operasional||{},J=F.jendela||{};
  const tf=(S.timeframe_menit||240)*60,fa=J.mulai,fb=J.selesai;
  if(!ok(fa)||!ok(fb)) return '<div class="empty">Pita waktu muncul setelah forward test dimulai.</div>';
  const now=Date.parse(R.dibuat_utc)/1000,miss=new Set(O.candle_tidak_diproses||[]);
  const ticks=[];for(let c=fa;c<fb;c+=tf){const t=c-tf;let k='',lab='belum tiba';
    if(miss.has(t)){k='miss';lab=(O.candle_tanpa_data||[]).includes(t)?'data ditolak Indodax (HTTP 403)':'tidak diproses tepat waktu'}else if(c+tf<=now||now>=fb){k='ok';lab='diproses tepat waktu'}else if(c<=now){k='wait';lab='masih dalam tenggat'}
    ticks.push(`<span class="tk ${k}" title="Candle tutup ${wib(c)}: ${lab}"></span>`)}
  const per=Math.round(86400/tf),days=Math.ceil(ticks.length/per);
  const dl=[];for(let d=0;d<days;d++)dl.push(`<span>${d%2===0?'H'+(d+1):''}</span>`);
  const el=Math.max(0,Math.min(1,(now-fa)/(fb-fa))),total=(fb-fa)/86400,hari=Math.min(total,Math.max(0,now-fa)/86400);
  return `<div class="tl-head"><span><b>Hari ke-${nf(hari,1)}</b> dari ${nf(total,1)} hari forward test</span><span class="num">${nf(el*100,0)}% berjalan</span></div>
   <div class="ticks">${ticks.join('')}</div><div class="daylab">${dl.join('')}</div>
   <div class="legend"><span><i style="background:var(--up)"></i>Candle diproses tepat waktu</span><span><i style="background:var(--down)"></i>Terlewat atau data ditolak Indodax</span><span><i style="background:var(--pending)"></i>Belum tiba</span></div>`;
}

   <div class="grid2" style="margin-top:16px">
    <div class="panel pad"><h3 style="margin-top:0">Waktu</h3><dl class="kv">
     <dt>Keterlambatan dari jadwal</dt><dd>median ${nf(kd.median/60,1)} menit, maksimum ${nf(kd.maks/60,1)} menit</dd>
     <dt>Candle tutup sampai diproses</dt><dd>median ${nf(tp.median/60,1)} menit, maksimum ${nf(tp.maks/60,1)} menit</dd>
     <dt>Durasi satu panggilan</dt><dd>median ${nf(dp.median,1)} detik, maksimum ${nf(dp.maks,1)} detik (batas 300)</dd>
     <dt>Status panggilan</dt><dd>${Object.entries(O.panggilan_per_status||{}).map(([k,v])=>esc(k)+' '+v).join(', ')||'—'}</dd>
     <dt>Sumber panggilan</dt><dd>${Object.entries(O.panggilan_per_sumber||{}).map(([k,v])=>esc(k)+' '+v).join(', ')||'—'}</dd>
     <dt>Uptime di luar gangguan Indodax</dt><dd>${pct(O.uptime_di_luar_gangguan_indodax,1,false)} (${nf(O.candle_tepat_waktu)} dari ${nf((O.candle_seharusnya||0)-(O.candle_terganggu_indodax||0))} candle yang tidak terdampak HTTP 403)</dd>
     <dt>Panggilan ditolak Indodax (HTTP 403)</dt><dd>${nf(O.panggilan_dengan_403)} panggilan, ${nf(O.panggilan_tanpa_data)} tanpa data sama sekali</dd>
     <dt>Candle tidak diproses</dt><dd>${(O.candle_tidak_diproses||[]).length?(O.candle_tidak_diproses||[]).map(wib).join(', '):'tidak ada'}</dd></dl></div>
    <div class="panel pad"><h3 style="margin-top:0">Error dan event</h3><dl class="kv">
     ${Object.entries(O.error_per_jenis||{}).map(([k,v])=>`<dt>Error ${esc(k)}</dt><dd>${v}</dd>`).join('')||'<dt>Error</dt><dd>tidak ada</dd>'}
     ${Object.entries(O.event_per_jenis||{}).map(([k,v])=>`<dt>Event ${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl></div>
   </div>
   <h3>Kill switch dan daily loss limit</h3>
   ${tbl(['Waktu','Jenis','Keterangan','Sumber'],[...ks,...dl].map(e=>[wibS(e.waktu_utc),esc(e.jenis),esc(e.keterangan||e.nilai||''),esc(e.sumber||'tick')]),[],'Tidak pernah dipakai selama forward test.')}
   <h3>Error terakhir</h3>
   ${tbl(['Waktu','Jenis','Konteks','Percobaan','Detail'],(O.error_terakhir||[]).slice().reverse().map(e=>[wibS(e.waktu_utc),esc(e.jenis),esc(e.konteks||''),nf(e.percobaan),`<span class="mono">${esc((e.detail||'').slice(0,90))}</span>`]),[],'Tidak ada error.')}`;

  const SP=R.spread||{},A=SP.asumsi_backtest||{},All=SP.seluruh_snapshot||{},Fw=SP.snapshot_forward||{};
  const bps=x=>ok(x)?nf(x*1e4,1):'—';
  $('#biaya').innerHTML=`<h2>Spread dan biaya eksekusi</h2><p class="sub">Asumsi backtest diukur dari snapshot order book sampai freeze (<code>config/costs.json</code>), lalu dibandingkan dengan seluruh snapshot. Satuan basis poin; ukuran order untuk slippage ${rp(SP.ukuran_order_idr)}.</p>
   ${tbl(['Pasangan','½ spread asumsi','½ spread semua snapshot','½ spread forward','Slip beli asumsi / semua','Slip jual asumsi / semua','Spread p90','Jumlah snapshot'],Object.keys(All).map(p=>{const a=A[p]||{},b=All[p]||{},c=Fw[p]||{};return [pair(p),bps(a.half_spread_median),bps(b.half_spread_median),bps(c.half_spread_median),bps(a.slip_buy_median)+' / '+bps(b.slip_buy_median),bps(a.slip_sell_median)+' / '+bps(b.slip_sell_median),bps(b.spread_p90),nf(a.n_valid)+' / '+nf(b.n_valid)]}),[1,2,3,4,5,6,7])}
   <p class="note">Fee taker per sisi memakai yang lebih mahal antara halaman resmi (beli ${nf(S.fee_taker_beli_persen_resmi,5)}%, jual ${nf(S.fee_taker_jual_persen_resmi,5)}%) dan /api/pairs (${nf(S.fee_api_taker_persen_dicatat,2)}%). ${esc(S.fee_rincian||'')} Sumber: ${esc(S.fee_sumber_url||'')}, diakses ${esc(S.fee_tanggal_akses||'')}. Minimum order ${rp(S.min_order_idr)}.</p>`;

  const tr=F.daftar_trade||[],op=F.posisi_terbuka||[],calls=O.panggilan_terakhir||[],nl=R.jumlah_baris_log||{};
  $('#log').innerHTML=`<h2>Trade dan log forward test</h2>
   <h3>Trade tertutup</h3>
   ${tbl(['Pasangan','Masuk','Keluar','Qty','Harga masuk','Harga keluar','Laba bersih','Return','Fee','Spread','Slippage','Alasan keluar'],tr.map(t=>[pair(t.pair),wibS(t.masuk_utc),wibS(t.keluar_utc),nf(t.qty,6),nf(t.harga_masuk,2),nf(t.harga_keluar,2),`<span class="${cls(t.laba_bersih_idr)}">${rp(t.laba_bersih_idr)}</span>`,`<span class="${cls(t.return_pct)}">${pp(t.return_pct)}</span>`,rp(t.fee_idr),rp(t.spread_idr),rp(t.slippage_idr),esc(t.alasan_keluar)]),[3,4,5,6,7,8,9,10],'Belum ada trade tertutup.')}
   <h3>Order simulasi</h3>
   ${tbl(['Waktu','Pasangan','Sisi','Qty','Best bid','Best ask','Fill rata-rata','Fee','Selisih vs harga sinyal','Alasan'],(F.orders||[]).slice().reverse().map(o=>[wibS(o.waktu_utc),pair(o.pair),o.sisi==='buy'?chip('beli','ok'):chip('jual','bad'),nf(o.qty,8),nf(o.best_bid,2),nf(o.best_ask,2),nf(o.harga_fill_avg,2),rp(o.fee_idr),pp(o.selisih_vs_sinyal_pct,3),esc(o.alasan)]),[3,4,5,6,7,8],'Belum ada order simulasi. Bot belum mendapat sinyal masuk selama forward test.')}
   <h3>Posisi terbuka</h3>
   ${tbl(['Pasangan','Masuk','Qty','Harga masuk','Biaya masuk'],op.map(o=>[pair(o.pair),wibS(o.masuk_utc),nf(o.qty,6),nf(o.harga_masuk,2),rp(o.biaya_masuk_idr)]),[2,3,4],'Tidak ada posisi terbuka.')}
   <h3>Equity harian (panggilan pertama setelah 00.00 WIB)</h3>
   ${tbl(['Tanggal','Diambil','Equity','Kas','Nilai posisi','Posisi'],(F.equity_harian||[]).map(e=>[e.tanggal_wib,wibS(e.waktu_utc),rp(e.equity),rp(e.kas),rp(e.nilai_posisi),nf(e.n_posisi)]),[2,3,4,5])}
   <h3>Panggilan terakhir</h3>
   ${tbl(['Mulai','Sumber','Status','Candle diproses','Equity','Posisi','Request','Error','Durasi'],calls.slice().reverse().map(c=>[wibS(c.mulai_utc),esc(c.sumber),c.status==='ok'?chip('candle baru','ok'):c.status==='error'?chip('error','bad'):c.status==='data_gagal_dicoba_lagi'?chip('data ditolak, dicoba lagi','bad'):chip(c.status==='candle_sudah_diproses'?'sudah diproses':c.status),c.candle_diproses_utc?wibS(c.candle_diproses_utc):'—',rp(c.equity),nf(c.n_posisi),nf(c.n_request),nf(c.n_error_api),nf(c.durasi_s,1)+' s']),[4,5,6,7,8])}
   <p class="note">Jumlah baris log mentah: calls ${nf(nl.calls)}, signals ${nf(nl.signals)}, orders ${nf(nl.orders)}, equity ${nf(nl.equity)}, errors ${nf(nl.errors)}, events ${nf(nl.events)}, snapshots ${nf(nl.snapshots)} baris.</p>`;


  const P=[['Timeframe',S.timeframe_menit+' menit, hanya candle yang sudah tertutup'],['Universe',(S.pairs||[]).map(pair).join(', ')+', dipilih dari likuiditas di awal backtest'],['Filter rezim',pair(S.pair_rezim)+' close di atas SMA'+S.sma_tren],
    ['Masuk','Close di atas high tertinggi '+S.breakout_n+' candle sebelumnya, close di atas SMA'+S.sma_tren+', SMA'+S.sma_tren+' naik lebih dari '+pct(S.slope_min,1,false)+' dalam '+S.slope_lookback+' candle, dan ATR'+S.atr_len+'/close di bawah '+S.atr_rasio_max+' kali rata-rata '+S.atr_rasio_len+' candle'],
    ['Keluar','Close turun ke close sinyal dikurangi '+S.stop_atr_mult+' ATR sinyal, atau setelah '+S.hold_bars+' candle'],
    ['Ukuran posisi','Nilai terkecil antara equity/'+S.maks_posisi+' dan '+pct(S.maks_porsi_per_posisi,0,false)+' equity, maksimal '+S.maks_posisi+' posisi'],
    ['Daily loss limit',pct(S.daily_loss_limit,1,false)+' dari equity awal hari WIB; setelah itu tidak membuka posisi baru sampai besok'],['Eksekusi','Beli di ask dan jual di bid, menghabiskan level order book; fee taker; minimum order '+rp(S.min_order_idr)],
    ['Validasi data','Tidak membuka posisi bila candle terakhir lebih tua dari 2 kali timeframe, ada candle hilang, harga atau volume nol, order book kosong, atau spread di atas '+pct(S.maks_spread,0,false)]];
  $('#aturan').innerHTML=`<h2>Aturan yang dibekukan</h2><p class="sub">Dibaca langsung dari <code>config/strategy.json</code>, file yang sama untuk bot dan backtest. Strategi berasal dari Struktur Breakout dan Keluar Waktu 30 Hari pada UTS (saham Kompas100 harian).</p>
   ${tbl(['Komponen','Aturan'],P.map(r=>[`<b>${r[0]}</b>`,`<span style="white-space:normal">${esc(r[1])}</span>`]))}
   <h3>Rumus metrik</h3>${tbl(['Metrik','Rumus'],Object.entries(R.rumus||{}).map(([k,v])=>[esc(k.replace(/_/g,' ')),`<span class="mono" style="white-space:normal">${esc(v)}</span>`]))}
`;
}

function renderSiap(R){
  const S=R.strategi||{},O=R.operasional||{},n=R.jumlah_baris_log||{},G=R.gap,sp=(R.spread||{}).asumsi_backtest;
  const it=(state,txt,det)=>`<li><span class="m ${state}"></span><span>${txt}<span class="d">${det}</span></span></li>`;
  const done=c=>c?'ok':'';
  const items=[
   ['Kecocokan backtest dan forward','25%',[
     it(G?'ok':'wait','Backtest jendela dijalankan ulang',G?`sinyal identik ${pct(G.sinyal.persen_identik,1,false)} (${nf(G.sinyal.identik)} dari ${nf(G.sinyal.dibandingkan)})`:'dijalankan setelah forward test selesai'),
     it((R.param_hash_di_log||[]).length===1?'ok':'wait','Satu hash parameter di seluruh log',(R.param_hash_di_log||[]).join(', ')||'menunggu log')]],
   ['Eksekusi realistis dan risiko','25%',[
     it(done(ok(S.fee_taker_beli_persen_resmi)&&!String(S.fee_sumber_url||'').startsWith('ISI')),'Fee resmi lengkap dengan sumber',ok(S.fee_taker_beli_persen_resmi)?`beli ${nf(S.fee_taker_beli_persen_resmi,5)}%, jual ${nf(S.fee_taker_jual_persen_resmi,5)}%`:'isi config/strategy.json'),
     it(done(!!sp),'Spread dan slippage backtest dari snapshot',sp?Object.keys(sp).length+' pasangan di config/costs.json':'jalankan tools/cost_model.py'),
     it('ok','Daily loss limit, kill switch, idempotency, retry','core/bot.py, buktinya di log events dan calls')]],
   ['Stabilitas dan log','20%',[
     it(done((n.calls||0)>0),'Bot berjalan dan mencatat',nf(n.calls||0)+' panggilan, '+nf(n.snapshots||0)+' snapshot'),
     it(ok(O.uptime)?(O.uptime>=.95?'ok':''):'wait','Uptime minimal 95%',ok(O.uptime)?pct(O.uptime,1,false):'menunggu candle forward')]],
   ['Keamanan dan kode','15%',[
     it('ok','Endpoint dilindungi CRON_SECRET','secret hanya di environment, .env tidak di-commit'),
     it('ok','Bot dan backtest memakai fungsi sinyal yang sama','core/strategy.py')]],
   ['Dashboard dan dokumentasi','15%',[
     it(done(!!R.backtest),'Backtest minimal 3 tahun',R.backtest?`${wibS((R.backtest.meta||{}).mulai_utc)} sampai ${wibS((R.backtest.meta||{}).selesai_utc)}`:'jalankan backtest penuh'),
     it('wait','hitung_ulang.py sama dengan dashboard, README dan refleksi lengkap','dicek dengan hitung_ulang.py --banding setelah forward test')]]];
  $('#siap').innerHTML=`<h2>Kesiapan menurut rubrik</h2><p class="sub">Status dibaca dari report ini, tidak diisi manual. Lingkaran penuh berarti terpenuhi, setengah berarti menunggu forward test, kosong berarti belum dikerjakan.</p>
   <div class="rub">${items.map(([h,w,xs])=>`<div class="panel"><h3>${h}<small>bobot ${w}</small></h3><ul class="ck">${xs.join('')}</ul></div>`).join('')}</div>`;
  $('#catatan').innerHTML=`<h2>Keterbatasan dan penggunaan AI</h2><div class="panel pad"><ul style="margin:0;padding-left:18px;max-width:80ch">
   <li>Strategi berasal dari UTS (saham harian) yang dipilih dari 947 kombinasi, sehingga risiko overfitting tetap ada. Parameter sengaja tidak dioptimasi ulang untuk kripto.</li>
   <li>Stop ${nf(S.stop_atr_mult,1)} ATR ditambahkan karena versi UTS tanpa stop-loss (trade terburuk sekitar −40%).</li>
   <li>Backtest memakai close ditambah spread dan slippage median dari snapshot. Keterlambatan jadwal tidak dimodelkan dan dibahas sebagai sumber selisih.</li>
   <li>Universe dipilih dari likuiditas di awal backtest, tetapi kandidat berasal dari daftar pasangan saat ini, sehingga masih ada sisa survivorship bias.</li>
   <li>AI dipakai untuk membantu menyusun kode bot, backtest, dashboard, dan dokumentasi. Semua angka berasal dari data Indodax dan log bot, lalu dihitung ulang oleh <code>hitung_ulang.py</code>.</li></ul></div>`;
}

const t=$('#theme');t.onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('tema',r.dataset.theme)}catch(e){}};
try{const s=localStorage.getItem('tema');if(s)document.documentElement.dataset.theme=s}catch(e){}

let lastOk=null;
function load(){
  fetch('/api/report',{cache:'no-store'}).then(r=>r.json()).then(R=>{if(R.error)throw new Error(R.error);const y=window.scrollY;render(R);window.scrollTo(0,y);jadwal=(R.strategi||{}).jadwal_cron_menit||jadwal;lastOk=new Date();stamp()})
  .catch(e=>{if(!lastOk){$('#status').innerHTML=`<div class="notice bad"><b>Dashboard gagal memuat data.</b> ${esc(e.message)}</div>`;$('#live').innerHTML='<span class="dot bad"></span><span>Data tidak dapat dimuat</span>'}});
}
let jadwal=[7,37];
function stamp(){const u=$('#upd');if(!u||!lastOk)return;
  const d=Math.max(0,Math.round((Date.now()-lastOk)/1000));
  const n=new Date();let nx=null;for(let h=0;h<2&&!nx;h++)for(const m of jadwal.slice().sort((a,b)=>a-b)){const t=new Date(n);t.setHours(n.getHours()+h,m,0,0);if(t>n){nx=t;break}}
  u.textContent='Data diperbarui '+(d<2?'barusan':d+' detik lalu')+(nx?', panggilan bot berikutnya '+nx.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')}
if(window.__REPORT__){render(window.__REPORT__);const u=document.getElementById('upd');if(u)u.textContent='Versi offline: data dibekukan saat file dibuat'}
else{load();setInterval(()=>{if(!document.hidden)load()},30000);setInterval(stamp,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
})();
</script>
