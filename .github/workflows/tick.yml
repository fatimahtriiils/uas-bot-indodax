name: tick-bot
on:
  schedule:
    - cron: "7 * * * *"      # tiap jam menit ke-7 UTC (hindari menit 0)
  workflow_dispatch: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Panggil /api/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TICK_URL: ${{ secrets.TICK_URL }}
        run: |
          for i in 1 2; do
            if curl -fsS -m 290 -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL?sumber=github"; then exit 0; fi
            echo "percobaan $i gagal, ulangi 30 detik lagi"; sleep 30
          done
          exit 1
